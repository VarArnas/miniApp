spring.application.name=miniApp

spring.datasource.url=jdbc:h2:mem:miniAppDb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=123

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

mybatis.config-location=classpath:myBatis-config.xml
mybatis.mapper-locations=classpath:mappers/*.xml
mybatis.type-handlers-package=com.example.miniapp.typeHandlers
logging.level.org.mybatis=DEBUG
logging.level.com.example.miniapp.daos.ShopDAO=TRACE


