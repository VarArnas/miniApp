spring.application.name=miniApp

spring.datasource.url=jdbc:h2:mem:miniAppDb;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=123
spring.h2.console.settings.web-allow-others=true


spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

#spring.jpa.show-sql=true
#spring.jpa.properties.hibernate.format_sql=true


spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

mybatis.config-location=classpath:myBatis-config.xml
mybatis.mapper-locations=classpath:mappers/*.xml
#logging.level.org.mybatis=DEBUG
#logging.level.com.example.miniapp.daos.ShopDAO=TRACE

timer.mode=default
#timer.mode=alternative

#decorator.enabled=true
decorator.enabled=false

#time.tracking.enabled=true
logging.file.name=./logs/application.log



