<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:f = "http://xmlns.jcp.org/jsf/core">
<h:head>
    <title>Mechanic Shops</title>
    <link rel="stylesheet" href="./templates/stylesMiniApp.css"/>
</h:head>
<h:body>

    <div id="title">
        <h1>miniApp</h1>
    </div>

    <div id="entities">
        <div class="flex-item">
            <div class="nameWithCreate">
                <h2>Mechanics</h2>
                <h:form>
                    <h:commandButton styleClass="createButton" value="Create New" action="#{shopBackingBean.goToWorkWithMechanic()}"/>
                </h:form>
            </div>
            <h:form id="shopsForm">
                    <h:dataTable class="table" value="#{shopBackingBean.getAllMechanicShops()}" var="shop">
                            <h:column class="fieldNames">
                                <strong>Name:</strong> #{shop.name}
                            </h:column>
                            <h:column class="fieldNames">
                                <h:commandButton styleClass="deleteButton" value="Delete" action="#{shopBackingBean.deleteMechanicShop(shop.id)}">
                                    <f:ajax execute="@this" render=":shopsForm :partsForm" />
                                </h:commandButton>
                            </h:column>
                            <h:column class="fieldNames">
                                <h:commandButton styleClass="updateButton" value="Modify" action="#{shopBackingBean.goToWorkWithMechanic(shop.id)}"/>
                            </h:column>
                    </h:dataTable>
            </h:form>
        </div>

        <div class="flex-item">
            <div class="nameWithCreate">
                <h2>Car parts</h2>
                <h:form>
                    <h:commandButton styleClass="createButton" value="Create New" action="#{carPartBackingBean.goToWorkWithPart()}">
                        <f:setPropertyActionListener target = "#{carPartBackingBean.updatePartDTO}" value = "#{null}" />
                    </h:commandButton>
                </h:form>
            </div>
            <h:form id="partsForm">
                    <h:dataTable class="table" value="#{carPartBackingBean.getAllParts()}" var="part" varStatus="loop">
                        <h:column class="fieldNames">
                            <strong>Name:</strong> #{part.name}
                        </h:column>
                        <h:column class="fieldNames">
                            <h:commandButton styleClass="deleteButton" value="Delete" action="#{carPartBackingBean.deletePart(part.id)}">
                                <f:ajax execute="@this" render=":partsForm" />
                            </h:commandButton>
                        </h:column>
                        <h:column class="fieldNames">
                            <h:commandButton styleClass="updateButton" value="Modify" action="#{carPartBackingBean.goToWorkWithPart(part.id)}"/>
                        </h:column>
                    </h:dataTable>
            </h:form>
        </div>

        <div class="flex-item">
            <div class="nameWithCreate">
                <h2>Cars</h2>
                <h:form>
                    <h:commandButton styleClass="createButton" value="Create New" action="#{carBackingBean.goToWorkWithCar}">
                        <f:setPropertyActionListener target = "#{carBackingBean.updateCarDTO}" value = "#{null}" />
                    </h:commandButton>
                </h:form>
            </div>
            <h:form id="carsForm">
                <h:dataTable class="table" value="#{carBackingBean.getAllCars()}" var="car">
                    <h:column class="fieldNames">
                        <strong>Model:</strong> #{car.model}
                    </h:column>
                    <h:column class="fieldNames">
                        <h:commandButton styleClass="deleteButton" value="Delete" action="#{carBackingBean.deleteCar(car.id)}">
                            <f:ajax execute="@this" render=":carsForm" />
                        </h:commandButton>
                    </h:column>
                    <h:column class="fieldNames">
                        <h:commandButton styleClass="updateButton" value="Modify" action="#{carBackingBean.goToWorkWithCar(car.id)}"/>
                    </h:column>
                </h:dataTable>
            </h:form>
        </div>
    </div>
</h:body>
</html>
