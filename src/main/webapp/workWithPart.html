<!DOCTYPE html>
<html lang="en">
<head>
    <title>Mechanic Shops</title>
    <style>
        span{
            color: green;
        }

        .headerOfWork{
            margin-top: 50px;
            margin-left: 20px;
            font-size: 2rem;
            color: white;
        }

        .creationForm{
            display: flex;
            justify-content: space-evenly;
            margin-bottom: 40px;
            margin-top: 100px;
            flex-wrap: wrap;
        }

        .creationItem{
            width: 45%;
            margin-left: 10px;
            color: rgba(255, 255, 255, 0.72);
            background: rebeccapurple;
            border-radius: 20px;

        }

        .creationItem > *{
            margin-left: 20px;
        }

        .creationItem > h3{
            font-size: 1.5rem;
        }

        #goBackForm{
            float: right;
            margin-right: 100px;
            width: 150px;
            height: 50px;
            margin-top: 200px;
        }

        #goBackForm > *{
            height: 100%;
            width: 100%;
            font-size: 1.5rem;
            border-radius: 20px;
        }


        .panelTable{
            margin-left: 50px;
            border-spacing: 0 20px;

        }

        .panelTable td{
            padding-left: 10px;
            padding-right: 10px;
            font-weight: bold;
            font-size: 1.2rem;
        }

        .panelTable td input, .panelTable td select{
            border-radius: 20px;
            border: 2px solid rebeccapurple;
            width: 300px;
        }

        .checkBoxes{
            border-spacing: 0 10px;
            width: 100%;
        }

        .checkBoxes td{
            font-size: 1.2rem;
            font-weight: bold;
            border: 2px solid rebeccapurple;
            border-bottom: 1px solid white;
            padding-bottom: 5px;
            width: 100%;
        }

        .scrollCheck{
            overflow-y: auto;
            margin-left: 50px;
            border-radius: 10px;
            max-height: 150px;
            margin-right: 150px;
            padding: 0;
            margin-bottom: 20px;
        }

        .creationButton{
            margin-top: 50px;
            width: 100%;
            display: block;
            text-align: center;
        }

        .creationButton * {
            height: 50px !important;
            width: 150px !important;
            font-size: 1.2rem !important;
            border-radius: 20px !important;
        }

        .scrollable-dropdown {
            max-height: 20px;
            overflow-y: auto;
            width: 200px;
        }

    </style>
    <link rel="stylesheet" href="./templates/stylesMiniApp.css"/>
</head>
<body>
    <div id="dynamicContentContainer"></div>

    <div>
        <button class="deleteButton" id="goBackButton">Go Back</button>
    </div>

    <script>
        const API_BASE_URL = '/api';

        document.addEventListener('DOMContentLoaded', function() {
            const urlParams = new URLSearchParams(window.location.search);
            const partId = urlParams.get('id');

            document.getElementById('goBackButton').addEventListener('click', goToHomePage);

            Promise.all([loadAllShops(), loadAllCars()])
                .then(([shops, cars]) => {
                    if (partId) {
                        loadPartData(partId, shops, cars);
                    } else {
                        showCreateView(shops, cars);
                    }
                });
        });

        async function loadAllShops() {
            try {
                const response = await fetch(`${API_BASE_URL}/shops`);
                return await response.json();
            } catch (error) {
                console.error('Error loading shops:', error);
                return [];
            }
        }

        async function loadAllCars() {
            try {
                const response = await fetch(`${API_BASE_URL}/cars`);
                return await response.json();
            } catch (error) {
                console.error('Error loading cars:', error);
                return [];
            }
        }

        function showCreateView(shops, cars) {
            const container = document.getElementById('dynamicContentContainer');
            container.innerHTML = `
                    <div class="headerOfWork">
                        <h2>Part creation</h2>
                    </div>

                    <form id="createPartForm" class="creationForm">
                        <div class="creationItem">
                            <h3>Input data</h3>
                            <div class="panelTable">
                                <label>Name: </label>
                                <input id="createName" type="text" required>
                                <span id="createNameError" style="color: red;"></span>

                                <label>Mechanic shop: </label>
                                <select id="createShop" class="scrollable-dropdown" required>
                                    <option value="">-- Select Shop --</option>
                                    ${shops.map(shop => `
                                        <option value="${shop.id}">${shop.name}</option>
                                    `).join('')}
                                </select>
                                <span id="createShopError" style="color: red;"></span>
                            </div>
                        </div>
                        <div class="creationItem">
                            <h3>Cars to assign</h3>
                            <div class="scrollCheck">
                                ${cars.map(car => `
                                    <div class="checkBoxes">
                                        <input type="checkbox" id="create-car-${car.id}" value="${car.id}">
                                        <label for="create-car-${car.id}">${car.model}</label>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                        <div class="creationButton">
                            <button type="submit" class="createButton">Create Part</button>
                        </div>
                    </form>
                `;

            document.getElementById('createPartForm').addEventListener('submit', handleCreatePart);
        }

        async function loadPartData(partId, shops, cars) {
            try {
                const response = await fetch(`${API_BASE_URL}/parts/${partId}`);
                const part = await response.json();
                showUpdateView(part, shops, cars);
            } catch (error) {
                console.error('Error loading part data:', error);
            }
        }

        function showUpdateView(part, shops, cars) {
            const container = document.getElementById('dynamicContentContainer');
            container.innerHTML = `
                    <div class="headerOfWork">
                        <h2>Modify part: <span>${part.name}</span> , with version: <span id="versionOfCar">${part.version}</span></h2>
                    </div>

                    <form id="updatePartForm" class="creationForm">
                        <div class="creationItem">
                            <h3>Change data</h3>
                            <div class="panelTable">
                                <label>Name: </label>
                                <input id="name" type="text" value="${part.name}" required>
                                <span id="nameError" style="color: red;"></span>

                                <label>Mechanic shop: </label>
                                <select id="shop" class="scrollable-dropdown" required>
                                    <option value="">-- Select Shop --</option>
                                    ${shops.map(shop => `
                                        <option value="${shop.id}" ${part.mechanicShop === shop.id ? 'selected' : ''}>
                                            ${shop.name}
                                        </option>
                                    `).join('')}
                                </select>
                                <span id="shopError" style="color: red;"></span>
                            </div>
                        </div>
                        <div class="creationItem">
                            <h3>Cars to assign/remove</h3>
                            <div class="scrollCheck">
                                ${cars.map(car => `
                                    <div class="checkBoxes">
                                        <input type="checkbox" id="update-car-${car.id}" value="${car.id}"
                                            ${part.cars && part.cars.includes(car.id) ? 'checked' : ''}>
                                        <label for="update-car-${car.id}">${car.model}</label>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                        <div class="creationButton">
                            <button type="submit" class="createButton" style="background: orange; border: 2px solid orange">
                                Update Part
                            </button>
                        </div>
                    </form>
                `;

            document.getElementById('updatePartForm').addEventListener('submit', (e) => handleUpdatePart(e, part.id));
        }

        async function handleUpdatePart(event, partId) {
            event.preventDefault();

            const name = document.getElementById('name').value;
            const shopId = document.getElementById('shop').value;
            const version = document.getElementById('versionOfCar').innerText;
            const checkboxes = document.querySelectorAll('#updatePartForm input[type="checkbox"]:checked');
            const selectedCars = Array.from(checkboxes).map(checkbox => checkbox.value);

            try {
                const response = await fetch(`${API_BASE_URL}/parts/${partId}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        name: name,
                        mechanicShop: shopId,
                        cars: selectedCars,
                        version: version
                    })
                });

                if (response.ok) {
                    goToHomePage();
                } else if(response.status === 409){
                    showOptimisticLockDialog();
                } else {
                    const error = await response.json();
                    document.getElementById('nameError').textContent = error.message || 'Error updating part';
                }
            } catch (error) {
                console.error('Error updating part:', error);
                document.getElementById('nameError').textContent = 'Error updating part';
            }
        }

        function showOptimisticLockDialog() {
            const dialog = document.createElement('div');
            dialog.style.background = '#ffe0e0';
            dialog.style.border = '2px solid #ff5555';
            dialog.style.padding = '20px';
            dialog.style.margin = '20px';
            dialog.style.textAlign = 'center';

            dialog.innerHTML = `
        <p><strong>Update failed:</strong> The car was modified by someone else.</p>
        <button id="refreshPageButton">Refresh Page</button>
        <button id="goBackHomeButton">Go Back</button>
    `;

            document.body.insertBefore(dialog, document.getElementById('goBackButton').parentNode);

            document.getElementById('refreshPageButton').addEventListener('click', () => {
                location.reload();
            });

            document.getElementById('goBackHomeButton').addEventListener('click', goToHomePage);
        }

        async function handleCreatePart(event) {
            event.preventDefault();

            const name = document.getElementById('createName').value;
            const shopId = document.getElementById('createShop').value;
            const checkboxes = document.querySelectorAll('#createPartForm input[type="checkbox"]:checked');
            const selectedCars = Array.from(checkboxes).map(checkbox => checkbox.value);

            try {
                const response = await fetch(`${API_BASE_URL}/parts`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        name: name,
                        mechanicShop: shopId,
                        cars: selectedCars
                    })
                });

                if (response.ok) {
                    goToHomePage();
                } else {
                    const error = await response.json();
                    document.getElementById('createNameError').textContent = error.message || 'Error creating part';
                }
            } catch (error) {
                console.error('Error creating part:', error);
                document.getElementById('createNameError').textContent = 'Error creating part';
            }
        }

        function goToHomePage() {
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
