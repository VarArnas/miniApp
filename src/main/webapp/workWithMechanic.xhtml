<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:f = "http://java.sun.com/jsf/core"
      xmlns:p="http://primefaces.org/ui">
<h:head>
    <title>Mechanic Shops</title>
    <style>
        span{
            color: green;
        }
    </style>
</h:head>
<body>
    <h:panelGroup rendered="#{shopBackingBean.selectedShop == null}">
        <h2>CREATE MECHANIC SHOP</h2>>
    </h:panelGroup>
    <h:panelGroup rendered="#{shopBackingBean.selectedShop != null}">
        <h2>Mechanic shop: <span> #{shopBackingBean.selectedShop.name} </span> </h2> <br/>
    </h:panelGroup>

    <h:form>
        <h:commandButton value="Go Back" action="#{shopBackingBean.goToHomePage}">
            <f:setPropertyActionListener target="#{shopBackingBean.selectedShop}" value="#{null}"/>
        </h:commandButton>
    </h:form>


</body>
</html>
