<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:f = "http://java.sun.com/jsf/core"
      xmlns:p="http://primefaces.org/ui">
<h:head>
    <title>Mechanic Shops</title>
    <style>
        span{
            color: green;
        }
    </style>
</h:head>
<body>
<h:panelGroup rendered="#{carPartBackingBean.selectedPart == null}">
    <h2>CREATE CAR PART</h2>>
</h:panelGroup>
<h:panelGroup rendered="#{carPartBackingBean.selectedPart != null}">
    <h2>Part: <span> #{carPartBackingBean.selectedPart.name} </span> </h2> <br/>
</h:panelGroup>

<h:form>
    <h:commandButton value="Go Back" action="#{carPartBackingBean.goToHomePage}">
        <f:setPropertyActionListener target="#{carPartBackingBean.selectedPart}" value="#{null}"/>
    </h:commandButton>
</h:form>


</body>
</html>
