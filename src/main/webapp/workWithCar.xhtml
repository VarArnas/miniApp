<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:f = "http://java.sun.com/jsf/core"
      xmlns:p="http://primefaces.org/ui">
<h:head>
    <title>Mechanic Shops</title>
    <style>
        span{
            color: green;
        }

        .headerOfWork{
            margin-top: 50px;
            margin-left: 20px;
            font-size: 2rem;
            color: white;
        }

        .creationForm{
            display: flex;
            justify-content: space-evenly;
            margin-bottom: 40px;
            margin-top: 100px;
            flex-wrap: wrap;
        }

        .creationItem{
            width: 45%;
            margin-left: 10px;
            color: rgba(255, 255, 255, 0.72);
            background: rebeccapurple;
            border-radius: 20px;

        }

        .creationItem > *{
            margin-left: 20px;

        }

        .creationItem > h3{
            font-size: 1.5rem;
        }

        #goBackForm{
            float: right;
            margin-right: 100px;
            width: 150px;
            height: 50px;
            margin-top: 200px;
        }

        #goBackForm > *{
            height: 100%;
            width: 100%;
            font-size: 1.5rem;
            border-radius: 20px;
        }


        .panelTable{
            margin-left: 50px;
            border-spacing: 0 10px;

        }

        .panelTable td{
            padding-left: 10px;
            padding-right: 10px;
            font-weight: bold;
            font-size: 1.2rem;
        }

        .panelTable td input{
            border-radius: 20px;
            border: 2px solid rebeccapurple;
            width: 300px;
        }

        .checkBoxes{
            border-spacing: 0 10px;
            width: 100%;
        }

        .checkBoxes td{
            font-size: 1.2rem;
            font-weight: bold;
            border: 2px solid rebeccapurple;
            border-bottom: 1px solid white;
            padding-bottom: 5px;
            width: 100%;
        }

        .scrollCheck{
            overflow-y: auto;
            margin-left: 50px;
            border-radius: 10px;
            max-height: 250px;
            margin-right: 150px;
            padding: 0;

        }

        .creationButton{
            margin-top: 50px;
            width: 100%;
            display: block;
            text-align: center;
        }

        .creationButton * {
            height: 50px !important;
            width: 150px !important;
            font-size: 1.2rem !important;
            border-radius: 20px !important;
        }

    </style>
    <link rel="stylesheet" href="./templates/stylesMiniApp.css"/>
</h:head>
<body>

    <h:panelGroup rendered="#{carBackingBean.updateCarDTO != null}">
        <div class="headerOfWork">
            <h2>Modify car: <span>#{carBackingBean.updateCarDTO.model}</span> </h2>
        </div>

        <h:form styleClass="creationForm">
            <div class="creationItem">
                <h3>Change data</h3>

                <h:panelGrid columns="3" styleClass="panelTable">
                    <h:outputLabel>Model: </h:outputLabel>
                    <h:inputText id="model" required="true" value="#{carBackingBean.updateCarDTO.model}" />
                    <h:message  for="model" style="color: red;"/>
                </h:panelGrid>

            </div>
            <div class="creationItem">
                <h3>Parts to assign/remove</h3>

                <div class="scrollCheck">
                    <h:selectManyCheckbox styleClass="checkBoxes"
                                          value="#{carBackingBean.updateCarDTO.parts}"
                                          layout="pageDirection">
                        <f:selectItems value="#{carPartBackingBean.getAllParts()}"
                                       var="part"
                                       itemLabel="#{part.name}"
                                       itemValue="#{part.id}"/>
                    </h:selectManyCheckbox>
                </div>

            </div>

            <div class="creationButton">
                <h:commandButton styleClass="createButton"
                                 value="Update Car"
                                 action="#{carBackingBean.updateCar()}"
                style="background: orange; border: 2px solid orange">
                </h:commandButton>
            </div>
        </h:form>
    </h:panelGroup>

    <h:panelGroup rendered="#{carBackingBean.updateCarDTO == null}">
        <div class="headerOfWork">
            <h2>Car creation</h2>
        </div>

        <h:form styleClass="creationForm">
            <div class="creationItem">
                <h3>Input data</h3>

                <h:panelGrid columns="2" styleClass="panelTable">
                    <h:outputLabel>Model: </h:outputLabel>
                    <h:inputText id="model" required="true" value="#{carBackingBean.insertCarDTO.model}" />
                    <h:message  for="model" style="color: red;"/>
                </h:panelGrid>

            </div>
            <div class="creationItem">
                <h3>Parts to assign</h3>

                <div class="scrollCheck">
                    <h:selectManyCheckbox styleClass="checkBoxes"
                                          value="#{carBackingBean.insertCarDTO.parts}"
                                          layout="pageDirection">
                        <f:selectItems value="#{carPartBackingBean.getAllParts()}"
                                       var="part"
                                       itemLabel="#{part.name}"
                                       itemValue="#{part.id}"/>
                    </h:selectManyCheckbox>
                </div>

            </div>

            <div class="creationButton">
                <h:commandButton styleClass="createButton"
                                 value="Create Car"
                                 action="#{carBackingBean.createNewCar()}">
                </h:commandButton>
            </div>
        </h:form>
    </h:panelGroup>

    <h:form id="goBackForm">
        <h:commandButton styleClass="deleteButton" value="Go Back" action="#{carBackingBean.goToHomePage}">
            <f:setPropertyActionListener target="#{carBackingBean.updateCarDTO}" value="#{null}"/>
        </h:commandButton>
    </h:form>

</body>
</html>
